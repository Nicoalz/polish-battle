# Déploiement Render. Un seul service : le serveur de jeu sert aussi le client compilé,
# donc même origine, pas de CORS et rien à configurer côté client.
#
# Render renseigne lui-même PORT ; le serveur le lit. `NODE_ENV=production` est
# indispensable : c'est lui qui active le service des fichiers du client.
#
# Pas de `corepack enable` dans la commande de build : il écrit ses raccourcis dans
# /usr/bin, en lecture seule sur l'hôte. Render fournit déjà pnpm dès qu'il repère un
# pnpm-lock.yaml, et `PNPM_VERSION` en fixe la version.
services:
  - type: web
    name: polish-battle
    runtime: node
    plan: free
    region: frankfurt
    branch: v2-rewrite
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @pb/web build
    startCommand: pnpm --filter @pb/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: PNPM_VERSION
        value: 11.9.0
